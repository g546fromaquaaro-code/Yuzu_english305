function visitDay(){let d=new Date(),today=d.toISOString().slice(0,10),y=new Date(d-864e5).toISOString().slice(0,10);if(streakData.last!==today){streakData.days=streakData.last===y?streakData.days+1:1;streakData.last=today;localStorage.setItem(STREAK_KEY,JSON.stringify(streakData))}}
function badgeHtml(){return BADGES.map(b=>'<span class="badge '+(mastered.size>=b.n?'on':'')+'"><i>'+b.e+'</i>'+b.n+'語</span>').join('')}
function sparkle(){for(let i=0;i<10;i++){let s=document.createElement('i');s.className='sparkle';s.textContent=i%2?'★':'✦';s.style.left=(45+Math.random()*10)+'vw';s.style.top='46vh';s.style.color=['#ff82ad','#b293ed','#f4bb35','#71cfaf'][i%4];s.style.setProperty('--x',(Math.random()*260-130)+'px');s.style.setProperty('--y',(Math.random()*220-150)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}function getQs(c){let p=c==='all'?W:W.filter(w=>w.category===c);return [...shuffle(p.filter(w=>!mastered.has(w.id))),...shuffle(p.filter(w=>mastered.has(w.id)))].slice(0,Math.min(10,p.length))}function mkChoices(q){let p=W.filter(w=>w.category===q.category&&w.id!==q.id&&w.ja!==q.ja);if(p.length<3)p=W.filter(w=>w.id!==q.id&&w.ja!==q.ja);return shuffle([q.ja,...shuffle(p).slice(0,3).map(w=>w.ja)])}function pct(n,d){return Math.round(n/d*100)}
function home(){clearInterval(timer);stopBgm();updateSoundButton();let p=pct(mastered.size,W.length);$('#app').innerHTML='<div class="shell"><div class="wrap"><header class="hero"><div class="brand"><b>A+</b>英検5級</div><p class="eyebrow">VOCABULARY TIME ATTACK</p><h1>英単語<span>305</span></h1><p class="lead">パッと見て、すばやく答えよう！<br>10問ずつ楽しく覚えるタイムアタック。</p></header><section class="master"><div class="ring" style="--p:'+p*3.6+'deg"><div><strong>'+p+'</strong><small>%</small></div></div><div class="pcontent"><div class="pcopy"><span>覚えた英単語</span><strong>'+mastered.size+' / 305語</strong></div><div class="track"><i style="width:'+p+'%"></i></div><p>'+(mastered.size?'あと'+(305-mastered.size)+'語でコンプリート！':'最初の1語からスタートしよう！')+'</p></div></section><div class="mode-picker"><button class="mode-btn '+(quizMode==="normal"?"on":"")+'" onclick="setMode(\'normal\')"><span>👀</span>英単語を見る</button><button class="mode-btn '+(quizMode==="listening"?"on":"")+'" onclick="setMode(\'listening\')"><span>🎧</span>リスニング</button></div><p class="listen-note">'+(quizMode==="normal"?"英単語を見て、発音も確認できるよ":"英語を聞いて、日本語の意味を選ぼう")+'</p><section class="reward-card"><div class="reward-top"><div class="reward-title">いまのレベル<b>レベル '+(Math.floor(mastered.size/20)+1)+' ✨</b><span class="streak">🔥 '+streakData.days+'日れんぞく</span></div><div class="reward-stars">⭐ '+stars+'</div></div><div class="badge-row">'+badgeHtml()+'</div></section><section class="section"><p class="eyebrow">CHOOSE A CATEGORY</p><h2>カテゴリを選ぼう</h2><button class="all" data-c="all" onclick="start(this.dataset.c)"><em>⚡</em><span><strong>全カテゴリ</strong><small>305語からランダム出題</small></span>→</button><div class="grid">'+C.map((c,i)=>{let ws=W.filter(w=>w.category===c.id),d=ws.filter(w=>mastered.has(w.id)).length,colors=['#f27d62','#edae35','#4b90bd','#65b9c6','#887ac5','#3eae79','#d977a0','#ef8b39'];return '<button class="cat" style="--a:'+colors[i]+'" data-c="'+c.id+'" onclick="start(this.dataset.c)"><span class="ico">'+c.icon+'</span><strong>'+c.label+'</strong><span class="count">'+ws.length+'語</span><span class="mini"><i style="width:'+pct(d,ws.length)+'%"></i></span><span class="done">'+d+'/'+ws.length+'</span></button>'}).join('')+'</div></section><div class="rules">⏱️ <b>タイムアタックのルール</b><br>制限時間は60秒。まだ正解していない単語を優先して出題します。</div><button class="reset" onclick="resetProgress()">学習記録をリセット</button></div></div>'}
function resetProgress(){if(confirm('305語の正解記録をリセットしますか？')){mastered.clear();stars=0;streakData={days:0,last:''};localStorage.removeItem(STAR_KEY);localStorage.removeItem(STREAK_KEY);save();home()}}
function start(c){visitDay();ensureAudio();se('start');if(quizMode==='listening')stopBgm();else startBgm();category=c;qs=getQs(c);qi=0;correct=combo=bestCombo=0;roundMistakes=[];time=60;showQ();clearInterval(timer);if(quizMode==='listening')setTimeout(()=>speakWord(questionsWord()),260);timer=setInterval(()=>{time--;let el=$('.timer');if(el)el.textContent='⏱ '+time;if(time<=0){clearInterval(timer);result()}},1000)}
function showQ(){state='idle';let q=qs[qi],m=C.find(c=>c.id===q.category);choices=mkChoices(q);let wordArea=quizMode==="listening"?'<div class="listen-stage"><span class="ear">🎧</span><strong>よく聞いて答えよう</strong><small>英単語はかくれています</small><button class="speak-button" onclick="speakWord(questionsWord())">🔊 もう一度聞く</button></div>':'<h1 class="word">'+q.en+'</h1><button class="speak-button" onclick="speakWord(questionsWord())">🔊 発音を聞く</button>';$('#app').innerHTML='<div class="shell"><div class="quiz"><header class="qhead"><button class="x" onclick="home()">×</button><div class="qprogress"><i style="width:'+((qi+1)/qs.length*100)+'%"></i></div><div class="timer">⏱ '+time+'</div></header><section class="qcard"><div class="top"><span class="chip">'+m.icon+' '+m.label+'</span><span>Q'+(qi+1)+' / '+qs.length+'</span></div><p class="prompt">この英語の意味は？</p>'+wordArea+'<div class="choices">'+choices.map((x,i)=>'<button class="choice" data-a="'+i+'" onclick="answer('+i+')"><b>'+String.fromCharCode(65+i)+'</b>'+x+'</button>').join('')+'</div><div id="feedback"></div></section></div></div>'}
function questionsWord(){return qs[qi]?qs[qi].en:''}
function answer(i){if(state!=='idle')return;let q=qs[qi],ok=choices[i]===q.ja;state=ok?'ok':'bad';document.querySelectorAll('[data-a]').forEach((b,j)=>{b.disabled=true;if(choices[j]===q.ja)b.classList.add('ok');else if(j===i)b.classList.add('bad')});if(ok){se('ok');mastered.add(q.id);save();correct++;combo++;bestCombo=Math.max(bestCombo,combo);stars+=2;localStorage.setItem(STAR_KEY,String(stars));sparkle()}else{se('bad');combo=0;if(!roundMistakes.some(x=>x.id===q.id))roundMistakes.push(q);}$('#feedback').className='feedback';$('#feedback').innerHTML='<strong>'+(ok?'正解！ ⭐ +'+(!mastered.has(q.id)?0:2):'おしい！ 正解は「'+q.ja+'」')+'</strong><button class="next" onclick="nextQuestion()">'+(qi+1===qs.length?'結果を見る':'次の問題')+' →</button>'}
function nextQuestion(){qi++;qi>=qs.length?result():showQ();if(qi<qs.length&&quizMode==='listening')setTimeout(()=>speakWord(questionsWord()),220)}
function mistakeHtml(){if(!roundMistakes.length)return '<div class="perfect-box">🎉<b>全問正解！</b>まちがえた単語はありません</div>';return '<section class="mistake-box"><h2>📝 まちがえた単語</h2><p>発音も聞いて、もう一度おぼえよう</p><div class="mistake-list">'+roundMistakes.map((w,i)=>'<div class="mistake-item"><div><strong>'+w.en+'</strong><small>'+w.ja+'</small></div><button class="mini-speak" onclick="speakMistake('+i+')" aria-label="'+w.en+'の発音を聞く">🔊</button></div>').join('')+'</div></section>'}
function speakMistake(i){if(roundMistakes[i])speakWord(roundMistakes[i].en)}
function result(){clearInterval(timer);stopBgm();se('finish');let acc=qi?Math.round(correct/Math.min(qi,qs.length)*100):0,total=Math.min(qi,qs.length);if(qi>=qs.length){total=qs.length;acc=Math.round(correct/total*100)}let bonus=acc===100?10:acc>=80?5:0;if(bonus){stars+=bonus;localStorage.setItem(STAR_KEY,String(stars))}$('#app').innerHTML='<div class="shell"><section class="result"><div class="celebrate">✨ 🎀 ✨</div><div class="trophy">🦄</div><p class="eyebrow">TIME ATTACK COMPLETE!</p><h1>'+(acc===100?'パーフェクト！':acc>=70?'よくできました！':'もう一度やってみよう！')+'</h1><div class="score"><strong>'+correct+'</strong><small>/ '+total+'問</small></div><div class="stats"><div>時間<strong>'+(60-time)+'秒</strong></div><div>最高コンボ<strong>'+bestCombo+'回</strong></div><div>正答率<strong>'+acc+'%</strong></div></div><div class="reward-pop">今回のごほうび<b>⭐ '+(correct*2+bonus)+' スター</b>'+(bonus?'全問ボーナスもゲット！':'次は全問正解でボーナス！')+'</div>'+mistakeHtml()+'<div class="actions"><button class="primary" onclick="start(category)">同じカテゴリでもう一度</button><button class="secondary" onclick="home()">カテゴリを選ぶ</button></div></section></div>'}updateSoundButton();home();
</script></body></html>
