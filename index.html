<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英単語305</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff8fc}.appframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="appframe" class="appframe" src="./legacy.html?v=14" title="英単語305" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('appframe');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  if(!d.getElementById('mission20-menu-style')){
    const s=d.createElement('style');
    s.id='mission20-menu-style';
    s.textContent=`
      .mode-picker{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:9px!important}
      .mode-btn{min-width:0!important;padding:7px 4px!important}
      .mode-btn.mission20-entry{color:#846b90}
      .mode-btn.mission20-entry:active{transform:scale(.97)}
      @media(max-width:420px){.mode-picker{gap:5px!important}.mode-btn{font-size:11px!important;padding:6px 2px!important}}
    `;
    d.head.appendChild(s);
  }
  const inject=()=>{
    const picker=d.querySelector('.mode-picker');
    if(!picker||d.getElementById('mission20ModeBtn'))return;
    const b=d.createElement('button');
    b.id='mission20ModeBtn';
    b.className='mode-btn mission20-entry';
    b.type='button';
    b.innerHTML='<span>🎮</span>MISSION 20';
    b.addEventListener('click',()=>{window.location.href='./hayamihyo.html?v=14'});
    picker.appendChild(b);
  };
  inject();
  const target=d.getElementById('app')||d.body;
  new MutationObserver(inject).observe(target,{childList:true,subtree:true});
});
</script>
</body>
</html>
