<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英語の早見表 パート1</title>
<style>
:root{--ink:#5d4968;--vio:#875fd0;--pink:#ff6fa7;--teal:#59b9b4;--line:#e5dce8;--cream:#fff5cb;--green:#69c99d;--red:#ed8da0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 8% 5%,#dff6f3 0,transparent 28rem),radial-gradient(circle at 96% 7%,#ffe1ed 0,transparent 29rem),linear-gradient(180deg,#fbfffe,#fff9fc 58%,#f5f1ff)}
button{font:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}.wrap{width:min(100%,1280px);margin:auto;padding:14px 18px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.back,.timer{border:2px solid #fff;background:#ffffffee;border-radius:17px;box-shadow:0 5px 18px #657e9420;font-weight:900}.back{padding:9px 14px;color:#268ba4}.timer{padding:10px 15px;min-width:122px;text-align:center;color:#76518d;font-size:17px}.timer.warn{color:#d85270;border-color:#f6a8b8}.hero{text-align:center;margin:8px 0 12px}.eyebrow{margin:0;color:#7d9a9e;font-size:10px;font-weight:950;letter-spacing:.16em}.hero h1{margin:4px 0;color:#6e4b83;font-size:clamp(30px,5vw,48px);line-height:1}.hero h1 span{color:var(--pink)}.hero p{margin:7px 0 0;color:#82758c;font-size:11px;font-weight:750;line-height:1.55}.panel{padding:14px;border:2px solid #fff;border-radius:25px;background:#ffffffdf;box-shadow:0 15px 40px #7d6b8e1c}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:650px;margin:0 auto 12px}.tab{border:2px solid #dfe9e8;border-radius:15px;padding:10px;background:#fff;color:#657e83;font-weight:900}.tab.on{border-color:#6ecac2;color:#fff;background:linear-gradient(105deg,#58b8b3,#9472d4);box-shadow:0 5px 0 #458f91}.rules{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px}.rule{padding:5px 9px;border-radius:99px;background:#eefbf8;color:#4f8886;font-size:9px;font-weight:900}.rule:nth-child(2){background:#fff2f8;color:#9d6681}.rule:nth-child(3){background:#f3efff;color:#7a63a0}.tableWrap{overflow-x:auto;border-radius:18px;border:2px solid #ded8df;background:#fff}.pronoun{width:100%;min-width:880px;border-collapse:collapse;table-layout:fixed}.pronoun th,.pronoun td{border-right:1px solid #dad5da;border-bottom:1px solid #dad5da;text-align:center}.pronoun th:last-child,.pronoun td:last-child{border-right:0}.pronoun tr:last-child td{border-bottom:0}.pronoun th{height:65px;padding:7px;background:var(--cream);color:#4b3d46;font-size:13px}.pronoun th small{display:block;margin-top:3px;color:#978783;font-size:8px}.pronoun td{height:62px;padding:6px;background:#fff;font-size:15px}.pronoun td.jp{background:#effaf8;color:#427b79;font-weight:900}.cell{width:100%;min-height:42px;border:2px solid transparent;border-radius:11px;background:transparent;color:#4f4057;font-weight:850}.cell.static{cursor:default}.cell.blank{border:2px dashed #d7c9df;background:#fbf9fd;color:#af9ab7}.cell.active{outline:3px solid #ff8eb9}.cell.filled{border-color:#9c7bd4;background:#f4efff;color:#654b7a;box-shadow:0 0 0 2px #9c7bd422}.cell.ok{border-color:var(--green);background:#edfbf5;color:#317d61}.cell.bad{border-color:var(--red);background:#fff0f4;color:#b95368}.correct{display:block;margin-top:2px;color:#c75c72;font-size:8px;font-weight:900}.bankTitle{text-align:center;margin:10px 0 6px;color:#7d668c;font-size:11px;font-weight:950}.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:1120px;margin:auto}.chip{border:2px solid #ded5e4;border-radius:99px;padding:9px 14px;background:#fff;color:#735485;font-size:13px;font-weight:950;box-shadow:0 3px 8px #82679712}.chip.used{opacity:.28;transform:scale(.94)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:850px;margin:12px auto 0}.secondary,.finish{border-radius:15px;padding:12px;font-weight:950}.secondary{border:2px solid #e5d9ea;background:#fff;color:#80668c}.finish{border:0;color:#fff;background:linear-gradient(105deg,#58b8b3,#956fd2);box-shadow:0 5px 0 #457f87}.result{display:none;max-width:850px;margin:10px auto 0;padding:13px;border-radius:18px;text-align:center;background:linear-gradient(135deg,#fff6cb,#ffe9f2)}.result.on{display:block}.result strong{font-size:27px;color:#e1729a}.records{margin-top:12px;padding:12px 14px;border-radius:18px;background:#f6fbfa}.records h3{margin:0 0 7px;color:#517f7c;font-size:13px}.rank{display:flex;justify-content:space-between;gap:12px;margin-top:5px;padding:7px 9px;border-radius:10px;background:#fff;font-size:10px;font-weight:850}.note{text-align:center;margin:10px 0 0;color:#89758f;font-size:10px;font-weight:800}
@media(max-width:700px){.wrap{padding:8px}.panel{padding:9px}.pronoun{min-width:790px}.pronoun th{height:58px;font-size:12px}.pronoun td{height:58px;font-size:14px}.cell{min-height:40px}.chip{padding:8px 11px;font-size:12px}.hero h1{font-size:30px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><button class="back" id="back">← 早見表一覧</button><div class="timer" id="timer">⏱ 60秒</div></div>
<header class="hero"><p class="eyebrow">PRONOUN + BE VERB</p><h1>📋 早見表 <span>パート1</span></h1><p>人称代名詞とbe動詞を横に見比べよう。<br>見るだけでも、穴埋めタイムアタックでも覚えられます。</p></header>
<section class="panel">
<div class="tabs"><button class="tab on" data-mode="view">👀 早見表を見る</button><button class="tab" data-mode="fill">⏱ 穴埋め60秒</button></div>
<div class="rules"><span class="rule">I → am</span><span class="rule">you / we / they → are</span><span class="rule">he / she / it → is</span></div>
<div class="tableWrap"><table class="pronoun"><thead><tr><th>日本語</th><th>〜は / が<small>主格</small></th><th>〜の<small>所有格</small></th><th>〜を / に<small>目的格</small></th><th>〜のもの<small>所有代名詞</small></th><th>be動詞</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="fillTools" style="display:none"><div class="bankTitle">👇 空欄をタップして、カードをセット</div><div class="bank" id="bank"></div><div class="actions"><button class="secondary" id="retry">🔄 問題を変える</button><button class="finish" id="finish">🏁 採点する</button></div><div class="result" id="result"></div></div>
<div class="note" id="viewNote">横に追うと、<b>I / my / me / mine / am</b> のようにセットで覚えやすいよ。</div>
<div class="records"><h3>🏆 満点タイム TOP5</h3><div id="records"></div></div>
</section>
</main>
<script>
const RECORD_KEY='eigo305-pronoun-be-top5-v1';
const ROWS=[
 ['私','I','my','me','mine','am'],
 ['あなた','you','your','you','yours','are'],
 ['彼','he','his','him','his','is'],
 ['彼女','she','her','her','hers','is'],
 ['それ','it','its','it','—','is'],
 ['私たち','we','our','us','ours','are'],
 ['あなたたち','you','your','you','yours','are'],
 ['彼ら','they','their','them','theirs','are']
];
const COLS=[1,2,3,4,5];
let mode='view',blanks=[],answers={},active=null,graded=false,startAt=0,endAt=0,timerId=null;
const $=s=>document.querySelector(s);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function key(r,c){return r+'-'+c}
function getRecords(){try{return JSON.parse(localStorage.getItem(RECORD_KEY)||'[]')}catch{return []}}
function saveRecord(sec){let a=[...getRecords(),{time:+sec.toFixed(1),date:new Date().toLocaleDateString('ja-JP')}].sort((x,y)=>x.time-y.time).slice(0,5);localStorage.setItem(RECORD_KEY,JSON.stringify(a))}
function showRecords(){let a=getRecords();$('#records').innerHTML=a.length?a.map((x,i)=>`<div class="rank"><span>${['🥇','🥈','🥉','4️⃣','5️⃣'][i]} ${i+1}位</span><b>${Number(x.time).toFixed(1)}秒</b></div>`).join(''):'<div class="note">まだ満点記録はありません</div>'}
function chooseBlanks(){let all=[];ROWS.forEach((row,r)=>COLS.forEach(c=>{if(row[c]!=='—')all.push(key(r,c))}));let picked=shuffle(all).slice(0,18);ROWS.forEach((row,r)=>{if(!picked.some(k=>k.startsWith(r+'-'))){let valid=COLS.filter(c=>row[c]!=='—');picked.push(key(r,valid[Math.floor(Math.random()*valid.length)]))}});return [...new Set(picked)]}
function newRound(){graded=false;answers={};active=null;blanks=chooseBlanks();startAt=performance.now();endAt=startAt+60000;clearInterval(timerId);timerId=setInterval(tick,100);$('#result').classList.remove('on');render();tick()}
function tick(){let left=Math.max(0,(endAt-performance.now())/1000);$('#timer').textContent='⏱ '+Math.ceil(left)+'秒';$('#timer').classList.toggle('warn',left<=10);if(left<=0&&!graded){finish(true)}}
function render(){
 $('#tbody').innerHTML=ROWS.map((row,r)=>`<tr><td class="jp">${row[0]}</td>${COLS.map(c=>{let k=key(r,c),isBlank=mode==='fill'&&blanks.includes(k),ans=answers[k],ok=graded&&ans&&ans.value===row[c],bad=graded&&isBlank&&(!ans||ans.value!==row[c]);if(!isBlank)return `<td><button class="cell static" type="button">${row[c]}</button></td>`;return `<td><button class="cell blank ${active===k&&!graded?'active':''} ${ans&&!graded?'filled':''} ${ok?'ok':''} ${bad?'bad':''}" type="button" data-cell="${k}">${ans?ans.value:'？'}${bad?`<span class="correct">正解：${row[c]}</span>`:''}</button></td>`}).join('')}</tr>`).join('');
 if(mode==='fill'&&!graded)document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>slot(b.dataset.cell));
 if(mode==='fill')renderBank();
}
function renderBank(){let cards=blanks.map((k,id)=>{let [r,c]=k.split('-').map(Number);return{id,value:ROWS[r][c]}});$('#bank').innerHTML=cards.map(x=>{let used=Object.values(answers).some(a=>a.id===x.id);return `<button class="chip ${used?'used':''}" type="button" data-card="${x.id}">${x.value}</button>`}).join('');if(!graded)document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>pickCard(+b.dataset.card,cards))}
function slot(k){if(answers[k])delete answers[k];active=k;render()}
function pickCard(id,cards){let card=cards.find(x=>x.id===id);if(!card)return;let usedKey=Object.keys(answers).find(k=>answers[k].id===id);if(usedKey){delete answers[usedKey];active=usedKey;render();return}let k=active&&!answers[active]?active:blanks.find(x=>!answers[x]);if(!k)return;answers[k]=card;active=blanks.find(x=>!answers[x])||null;render()}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));$('#fillTools').style.display=m==='fill'?'block':'none';$('#viewNote').style.display=m==='view'?'block':'none';clearInterval(timerId);$('#timer').classList.remove('warn');$('#result').classList.remove('on');if(m==='fill')newRound();else{$('#timer').textContent='⏱ 60秒';blanks=[];answers={};active=null;graded=false;render()}}
function finish(timeout=false){if(graded)return;graded=true;clearInterval(timerId);let sec=timeout?60:Math.min(60,(performance.now()-startAt)/1000),score=0;blanks.forEach(k=>{let [r,c]=k.split('-').map(Number);if(answers[k]&&answers[k].value===ROWS[r][c])score++});render();let perfect=score===blanks.length;if(perfect)saveRecord(sec);$('#result').classList.add('on');$('#result').innerHTML=`<div>${perfect?'✨🏆✨':'🎯'}</div><strong>${score} / ${blanks.length}</strong><div>${perfect?'満点！ '+sec.toFixed(1)+'秒でクリア！':'赤いところを確認して、もう一度挑戦！'}</div>`;showRecords()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#retry').onclick=newRound;$('#finish').onclick=()=>finish(false);$('#back').onclick=()=>location.href='./hayamihyo2.html?v=21';showRecords();render();
</script>
</body>
</html>
