</style></head><body><main class="wrap"><button class="back" onclick="location.href='./?v=22'">← 442語へ</button><header class="hero"><p class="eyebrow">QUICK TABLE SERIES</p><h1>📚 早見表<span>シリーズ</span></h1><p>見る → 穴埋め → タイムアタック。<br>パート1から順番に、英語のルールを表で覚えていこう。</p></header><section class="grid"><button class="card part1" onclick="location.href='./hayamihyo1.html?v=22'"><span class="num">PART 1</span><span class="ico">👤</span><h2>人称代名詞＋be動詞</h2><p>I / my / me / mine と am・are・is を横に比較。60秒穴埋めはスタートを押してから開始。</p><span class="go">覚える ▶</span></button><button class="card part2" onclick="location.href='./hayamihyo2-grammar.html?v=22'"><span class="num">PART 2</span><span class="ico">📋</span><h2>一般動詞・進行形・can</h2><p>主語・be動詞・一般動詞・進行形・canを横に比較。表を見るモードと穴埋めモード。</p><span class="go">覚える ▶</span></button><button class="card part3" onclick="location.href='./hayamihyo3.html?v=22'"><span class="num">PART 3</span><span class="ico">❓</span><h2>疑問文の早見表</h2><p>Do / Does、be動詞、can、現在進行形の疑問文を整理。見るモード＋60秒穴埋め。</p><span class="go">覚える ▶</span></button><div class="card future"><span class="num">PART 4</span><span class="ico">✨</span><h2>その次の早見表</h2><p>次のテーマも、このシリーズ画面に追加していきます。</p><span class="go">準備中</span></div></section><div class="note">💡 PART3は「疑問文の文頭」を見比べる早見表。Do / Does と Am / Are / Is / Can の使い分けを穴埋めで覚えられます。</div></main></body></html>
