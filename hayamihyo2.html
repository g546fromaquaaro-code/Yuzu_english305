.card p{font-size:14px}.card{padding-bottom:48px}.part4{border-color:#f6b9d2}</style></head><body><main class="wrap"><button class="back" onclick="location.href='./?v=25'">← 442語へ</button><header class="hero"><p class="eyebrow">QUICK TABLE SERIES</p><h1>📚 早見表<span>シリーズ</span></h1><p>見る → 意味を言う → 文で解く → 復習。<br>パート1から順番に、英語のルールを表で覚えていこう。</p></header><section class="grid"><button class="card part1" onclick="openPart(1,'./hayamihyo1.html?v=25')"><span class="num">PART 1</span><span class="ico">👤</span><h2>人称代名詞＋be動詞</h2><p>I / my / me / mine と am・are・is を横に比較。60秒穴埋めはスタートを押してから開始。</p><span class="go">覚える ▶</span></button><button class="card part2" onclick="openPart(2,'./hayamihyo2-grammar.html?v=25')"><span class="num">PART 2</span><span class="ico">📋</span><h2>一般動詞・進行形・can</h2><p>主語・be動詞・一般動詞・進行形・canを横に比較。表を見るモードと穴埋めモード。</p><span class="go">覚える ▶</span></button><button class="card part3" onclick="openPart(3,'./hayamihyo3.html?v=25')"><span class="num">PART 3</span><span class="ico">❓</span><h2>疑問文の早見表</h2><p>Do / Does、be動詞、can、現在進行形の疑問文を整理。見るモード＋60秒穴埋め。</p><span class="go">覚える ▶</span></button><button class="card part4" onclick="location.href='./hayamihyo4.html?v=26'"><span class="num">PART 4</span><span class="ico">🎯</span><h2>5級の重要表・合格への練習</h2><p>疑問詞と返事・否定文・時刻と場所。時間制限なしの確認問題と、毎日の学習手順。</p><span class="go">練習する ▶</span></button></section><div class="note">💡 PART1〜3の閲覧で「レシピブック」が完成。見た記録と、覚えたことは別だよ。翌日、答えを隠して言えたら一歩前進！</div></main><script>function openPart(n,url){let parts=[];try{parts=JSON.parse(localStorage.getItem('eigo305-guide-parts-v1')||'[]')}catch{};if(!Array.isArray(parts))parts=[];parts=[...new Set([...parts.filter(x=>[1,2,3].includes(x)),n])];try{localStorage.setItem('eigo305-guide-parts-v1',JSON.stringify(parts))}catch{};location.href=url}</script></body></html>
