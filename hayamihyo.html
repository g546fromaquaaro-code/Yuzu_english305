<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語305 早見表</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#fff7fc;color:#624d70}main{max-width:760px;margin:auto;padding:18px}button{font:inherit}.top{display:flex;justify-content:space-between}.btn,.chip,.slot{border:0;border-radius:14px;background:#fff;padding:12px;box-shadow:0 3px 12px #9676a522}.hero{text-align:center}.hero h1{color:#704b87}.panel{background:#ffffffcc;border-radius:22px;padding:15px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode.on,.primary,.finish{background:linear-gradient(135deg,#9d7bd4,#ff81ad);color:#fff}.sets,.bank{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.set.on{background:#fff0f7;border:2px solid #ff9fc3}.primary{width:100%;margin-top:14px;border:0;border-radius:16px;padding:14px;font-weight:900}.game{display:none}.game.on{display:block}.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{text-align:left;border:2px solid #eadff0}.slot.active{outline:3px solid #ff9fc3}.slot.ok{background:#effbf5;border-color:#66c89e}.slot.bad{background:#fff0f3;border-color:#ef8b9f}.ja{display:block;font-weight:900;color:#704b87}.ans{display:block;margin-top:6px;padding:6px;border:2px dashed #eadff0;border-radius:9px}.correct{display:block;color:#c65370;font-size:11px;margin-top:4px}.chip{font-weight:800}.chip.used{opacity:.25}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.actions button{border:0;border-radius:15px;padding:14px;font-weight:900}.result{text-align:center;margin-top:15px}.rank{display:flex;justify-content:space-between;background:#fff;padding:8px;margin-top:6px;border-radius:10px}@media(max-width:480px){.words{grid-template-columns:1fr}}</style></head><body><main><div class="top"><button class="btn" id="back">← 305語へ</button><b id="timer">⏱ 0.0秒</b></div><section id="setup"><div class="hero"><h1>🌸 早見表チャレンジ</h1><p>日本語を見て、下の英単語カードを選んで埋めよう！</p></div><div class="panel"><div class="modes"><button class="btn mode on" data-mode="set">📚 20語ずつ</button><button class="btn mode" data-mode="weak">🌱 未習得20語</button></div><div class="sets" id="sets"></div><button class="primary" id="start">スタート！</button><h3>🏆 満点トップ5</h3><div id="records"></div></div></section><section class="game" id="game"><div class="hero"><h1>英単語をうめよう</h1><p>日本語の欄をタップ → 英単語を選ぶ → 全部入れたら「終わり」</p></div><div class="words" id="words"></div><h3 style="text-align:center">👇 英単語を選ぼう</h3><div class="bank" id="bank"></div><div class="actions"><button id="reset">やり直す</button><button class="finish" id="finish">終わり</button></div><div class="result" id="result"></div></section></main><script>const MKEY='eigo305-mastered-v1',RKEY='eigo305-hayamihyo-records-v1';let W=[],mode='set',setIndex=0,round=[],bank=[],fill={},active=0,startAt=0,timerId,graded=false;const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function mastered(){try{return new Set(JSON.parse(localStorage.getItem(MKEY)||'[]'))}catch{return new Set}}function records(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}')}catch{return {}}}function key(){return mode==='set'?'set-'+setIndex:'weak'}function showRecords(){let r=(records()[key()]||[]).slice(0,5);$('#records').innerHTML=r.length?r.map((x,i)=>`<div class="rank"><span>${i+1}位</span><b>${x.time.toFixed(1)}秒</b></div>`).join(''):'まだ満点記録はありません'}function showSets(){let n=Math.ceil(W.length/20);$('#sets').innerHTML=Array.from({length:n},(_,i)=>`<button class="btn set ${i===setIndex?'on':''}" data-i="${i}">${i*20+1}〜${Math.min(W.length,(i+1)*20)}</button>`).join('');document.querySelectorAll('.set').forEach(b=>b.onclick=()=>{setIndex=+b.dataset.i;showSets();showRecords()});$('#sets').style.display=mode==='set'?'flex':'none'}function pick(){if(mode==='set')return W.slice(setIndex*20,setIndex*20+20);let m=mastered(),u=W.filter(w=>!m.has(w.id)),p=u.length>=20?u:[...u,...W.filter(w=>m.has(w.id))];return shuffle(p).slice(0,20)}function start(){round=pick();bank=shuffle(round.map((w,i)=>({id:i,en:w.en,used:null})));fill={};active=0;graded=false;$('#setup').style.display='none';$('#game').classList.add('on');$('#result').innerHTML='';$('#bank').style.display='flex';$('#finish').style.display='block';startAt=performance.now();clearInterval(timerId);timerId=setInterval(()=>$('#timer').textContent='⏱ '+((performance.now()-startAt)/1000).toFixed(1)+'秒',100);render()}function render(){ $('#words').innerHTML=round.map((w,i)=>{let x=bank.find(a=>a.id===fill[i]),ok=graded&&x&&x.en===w.en,bad=graded&&(!x||x.en!==w.en);return `<button class="slot ${!graded&&active===i?'active':''} ${ok?'ok':''} ${bad?'bad':''}" data-s="${i}"><span class="ja">${w.ja}</span><span class="ans">${x?x.en:'？'}</span>${bad?`<span class="correct">正解：${w.en}</span>`:''}</button>`}).join('');$('#bank').innerHTML=graded?'':bank.map(x=>`<button class="chip ${x.used!==null?'used':''}" data-c="${x.id}">${x.en}</button>`).join('');if(!graded){document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>slot(+b.dataset.s));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>chip(+b.dataset.c))}}function slot(i){if(fill[i]!=null){let x=bank.find(a=>a.id===fill[i]);if(x)x.used=null;delete fill[i]}active=i;render()}function chip(id){let x=bank.find(a=>a.id===id);if(x.used!==null){delete fill[x.used];x.used=null;render();return}let s=active;if(s==null||fill[s]!=null)s=round.findIndex((_,i)=>fill[i]==null);if(s<0)return;fill[s]=id;x.used=s;active=round.findIndex((_,i)=>fill[i]==null);if(active<0)active=null;render()}function finish(){if(graded)return;graded=true;clearInterval(timerId);let sec=(performance.now()-startAt)/1000,score=0;round.forEach((w,i)=>{let x=bank.find(a=>a.id===fill[i]);if(x&&x.en===w.en)score++});render();$('#bank').style.display='none';$('#finish').style.display='none';let perfect=score===round.length;if(perfect){let m=mastered();round.forEach(w=>m.add(w.id));localStorage.setItem(MKEY,JSON.stringify([...m]));let all=records(),k=key();all[k]=[...(all[k]||[]),{time:+sec.toFixed(1)}].sort((a,b)=>a.time-b.time).slice(0,5);localStorage.setItem(RKEY,JSON.stringify(all))}$('#result').innerHTML=`<h2>${perfect?'🎉 パーフェクト！':'あと少し！'}</h2><h1>${score} / ${round.length}</h1><p>${perfect?'⭐ 満点記録を保存したよ！':'赤いところの英単語を確認しよう。'}</p><button class="primary" id="again">もう一度</button>`;$('#again').onclick=start;showRecords()}async function load(){try{let h=await fetch('./index.html?v=5').then(r=>r.text()),m=h.match(/const DATA=(\{.*?\}),W=DATA\.words/s);W=JSON.parse(m[1]).words;showSets();showRecords();$('#start').disabled=false}catch(e){$('#start').textContent='単語データを読み込めませんでした'}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));showSets();showRecords()});$('#start').onclick=start;$('#finish').onclick=finish;$('#reset').onclick=start;$('#back').onclick=()=>location.href='./?v=5';$('#start').disabled=true;load();</script></body></html>
