<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英単語305 早見表チャレンジ</title>
<style>
:root{--navy:#704b87;--ink:#5b4568;--pink:#ff82ad;--lav:#c9b5ff;--mint:#9ce5d0;--yellow:#ffd86b;--bg:#fff8fc;--ok:#66c89e;--bad:#ef8b9f}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 6%,#ffd9e8 0,transparent 22rem),radial-gradient(circle at 94% 10%,#d8ceff 0,transparent 24rem),linear-gradient(180deg,#fff8fc,#f7f1ff 52%,#effbf8);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button{font:inherit;-webkit-tap-highlight-color:transparent}.shell{min-height:100vh;padding:22px max(14px,env(safe-area-inset-left)) 30px}.wrap{width:min(100%,760px);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{border:0;border-radius:16px;padding:10px 13px;background:#fff;color:var(--navy);font-weight:900;box-shadow:0 5px 16px #9874a526}.timer{padding:10px 14px;border-radius:16px;background:#fff;color:var(--navy);font-weight:900;box-shadow:0 5px 16px #9874a526}.hero{text-align:center;margin:18px 0}.hero .eyebrow{margin:0;color:#a06fb1;font-size:11px;font-weight:900;letter-spacing:.12em}.hero h1{margin:6px 0;color:var(--navy);font-size:clamp(30px,8vw,50px);line-height:1}.hero p{margin:9px 0 0;color:#806b8b;font-size:13px;line-height:1.6}.panel{padding:16px;border:2px solid #fff;border-radius:24px;background:#fffc;box-shadow:0 12px 30px #9a73a51d}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{border:0;border-radius:18px;padding:14px 10px;background:linear-gradient(145deg,#fff,#fff8fc);color:var(--navy);font-weight:900;box-shadow:0 5px 16px #9874a51c}.mode.on{color:#fff;background:linear-gradient(135deg,#9d7bd4,#ff81ad)}.mode small{display:block;margin-top:3px;font-size:10px;opacity:.78}.setrow{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding:2px 0 5px}.setbtn{flex:0 0 auto;border:2px solid #eadff0;border-radius:99px;padding:9px 12px;background:#fff;color:#7e628c;font-weight:850}.setbtn.on{border-color:#ff9fc3;background:#fff0f7;color:#c95f8c}.primary{width:100%;margin-top:14px;border:0;border-radius:18px;padding:15px;color:#fff;background:linear-gradient(135deg,#9d7bd4,#ff81ad);font-weight:900;box-shadow:0 6px 0 #795ba9}.hint{margin:12px 0 0;text-align:center;color:#9c83a5;font-size:11px}.recordbox{margin-top:14px;padding:13px;border-radius:18px;background:#fff7fb;border:1px solid #eedceb}.recordbox b{color:#825c9a}.rank{display:flex;justify-content:space-between;margin-top:7px;padding:8px 10px;border-radius:12px;background:#fff;font-size:12px}.rank strong{color:#df7a9f}.game{display:none}.game.on{display:block}.progress{margin:12px 0 14px;height:10px;background:#eadff0;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff82ad,#c3a4ff,#8fdcc9)}.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{min-width:0;border:2px solid #eadff0;border-radius:15px;padding:10px;background:#fff;text-align:left}.slot .en{display:block;color:var(--navy);font-size:16px;font-weight:900;overflow-wrap:anywhere}.slot .ja{display:block;margin-top:5px;min-height:26px;padding:6px 7px;border:2px dashed #e6d7ed;border-radius:10px;color:#a28cab;font-size:11px;font-weight:800}.slot.active{outline:3px solid #ff9fc3}.slot.ok{border-color:var(--ok);background:#f0fbf6}.slot.bad{border-color:var(--bad);background:#fff2f5}.slot.bad .correct{display:block;margin-top:4px;color:#c65370;font-size:10px;font-weight:800}.banktitle{margin:18px 0 9px;text-align:center;color:#8b6b99;font-size:12px;font-weight:900}.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.chip{border:2px solid #e6d7ed;border-radius:99px;padding:8px 11px;background:#fff;color:#765c82;font-size:12px;font-weight:850}.chip.used{opacity:.28}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.finish,.retry{border:0;border-radius:17px;padding:14px;font-weight:900}.finish{color:#fff;background:linear-gradient(135deg,#8d70cc,#ff78a8)}.retry{background:#fff;color:#866793;border:2px solid #e5d6ec}.result{display:none;margin-top:16px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#fff6c9,#ffe7f1);text-align:center}.result.on{display:block}.result h2{margin:0;color:#7d578f}.big{margin:8px 0;color:#df7a9f;font-size:35px;font-weight:950}.perfect{color:#d39822;font-weight:900}.small{color:#927c99;font-size:11px}@media(max-width:480px){.words{grid-template-columns:1fr}.slot{padding:9px}.slot .en{font-size:15px}}
</style>
</head>
<body>
<main class="shell"><div class="wrap">
  <div class="topbar"><button class="back" id="back">← 305語へ</button><div class="timer" id="timer">⏱ 0.0秒</div></div>
  <section id="setup">
    <div class="hero"><p class="eyebrow">VOCABULARY MATCH CHALLENGE</p><h1>🌸 早見表チャレンジ</h1><p>英単語20個に、日本語の意味カードを入れていこう。<br>見て・選んで・並べるから、覚えやすい！</p></div>
    <div class="panel">
      <div class="modegrid">
        <button class="mode on" data-mode="set">📚 20語ずつ<small>1〜20、21〜40…</small></button>
        <button class="mode" data-mode="weak">🌱 未習得20語<small>まだ覚えていない単語優先</small></button>
      </div>
      <div class="setrow" id="setrow"></div>
      <button class="primary" id="start">スタート！</button>
      <p class="hint">満点のときだけタイムを記録。満点で20語を「覚えた」に追加します。</p>
      <div class="recordbox"><b>🏆 このセットの満点トップ5</b><div id="records"></div></div>
    </div>
  </section>

  <section class="game" id="game">
    <div class="hero"><p class="eyebrow" id="roundLabel">20 WORDS</p><h1>意味をうめよう</h1><p>空欄をタップ → 下の意味カードを選ぶ。全部入れたら「終わり」！</p></div>
    <div class="progress"><i id="progress" style="width:0%"></i></div>
    <div class="words" id="words"></div>
    <div id="bankWrap"><div class="banktitle">👇 日本語の意味を選ぼう</div><div class="bank" id="bank"></div></div>
    <div class="actions"><button class="retry" id="reset">やり直す</button><button class="finish" id="finish">終わり</button></div>
    <div class="result" id="result"></div>
  </section>
</div></main>
<script>
const MASTERED_KEY='eigo305-mastered-v1', REC_KEY='eigo305-hayamihyo-records-v1';
let W=[],mode='set',setIndex=0,round=[],bank=[],fill={},active=null,startAt=0,timerId=null,graded=false;
const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mastered(){try{return new Set(JSON.parse(localStorage.getItem(MASTERED_KEY)||'[]'))}catch(e){return new Set()}}
function records(){try{return JSON.parse(localStorage.getItem(REC_KEY)||'{}')}catch(e){return {}}}
function recordKey(){return mode==='set'?'set-'+setIndex:'weak'}
function renderRecords(){let r=(records()[recordKey()]||[]).slice(0,5);$('#records').innerHTML=r.length?r.map((x,i)=>`<div class="rank"><span>${i+1}位</span><strong>${x.time.toFixed(1)}秒</strong></div>`).join(''):'<div class="small" style="margin-top:8px">まだ満点記録はありません</div>'}
function renderSets(){let count=Math.ceil(W.length/20);$('#setrow').innerHTML=Array.from({length:count},(_,i)=>`<button class="setbtn ${i===setIndex?'on':''}" data-i="${i}">${i*20+1}〜${Math.min(W.length,(i+1)*20)}</button>`).join('');document.querySelectorAll('.setbtn').forEach(b=>b.addEventListener('click',()=>{setIndex=+b.dataset.i;renderSets();renderRecords()}));$('#setrow').style.display=mode==='set'?'flex':'none'}
function pickRound(){if(mode==='set')return W.slice(setIndex*20,setIndex*20+20);let m=mastered(),weak=W.filter(w=>!m.has(w.id)),pool=weak.length>=20?weak:[...weak,...W.filter(w=>m.has(w.id))];return shuffle(pool).slice(0,20)}
function start(){round=pickRound();bank=shuffle(round.map((w,i)=>({id:i,ja:w.ja,used:null})));fill={};active=0;graded=false;startAt=performance.now();$('#setup').style.display='none';$('#game').classList.add('on');$('#result').classList.remove('on');$('#bankWrap').style.display='block';$('#finish').style.display='block';$('#roundLabel').textContent=mode==='set'?`${setIndex*20+1}〜${setIndex*20+round.length} WORDS`:'未習得20語';renderGame();clearInterval(timerId);timerId=setInterval(()=>$('#timer').textContent='⏱ '+((performance.now()-startAt)/1000).toFixed(1)+'秒',100)}
function renderGame(){let used=Object.keys(fill).length;$('#progress').style.width=(used/round.length*100)+'%';$('#words').innerHTML=round.map((w,i)=>{let bi=fill[i],it=bank.find(x=>x.id===bi),ok=graded&&it&&it.ja===w.ja,bad=graded&&(!it||it.ja!==w.ja);return `<button class="slot ${!graded&&active===i?'active':''} ${ok?'ok':''} ${bad?'bad':''}" data-slot="${i}"><span class="en">${w.en}</span><span class="ja">${it?it.ja:'？'}</span>${bad?`<span class="correct">正解：${w.ja}</span>`:''}</button>`}).join('');$('#bank').innerHTML=graded?'':bank.map(x=>`<button class="chip ${x.used!==null?'used':''}" data-chip="${x.id}">${x.ja}</button>`).join('');if(!graded){document.querySelectorAll('[data-slot]').forEach(b=>b.addEventListener('click',()=>chooseSlot(+b.dataset.slot)));document.querySelectorAll('[data-chip]').forEach(b=>b.addEventListener('click',()=>chooseChip(+b.dataset.chip)))} }
function chooseSlot(i){if(graded)return;if(fill[i]!=null){let it=bank.find(x=>x.id===fill[i]);if(it)it.used=null;delete fill[i]}active=i;renderGame()}
function chooseChip(id){if(graded)return;let it=bank.find(x=>x.id===id);if(!it)return;if(it.used!==null){delete fill[it.used];it.used=null;renderGame();return}let s=active;if(s==null||fill[s]!=null)s=round.findIndex((_,i)=>fill[i]==null);if(s<0)return;fill[s]=id;it.used=s;active=round.findIndex((_,i)=>fill[i]==null);if(active<0)active=null;renderGame()}
function finish(){if(graded)return;graded=true;clearInterval(timerId);let elapsed=(performance.now()-startAt)/1000,score=0;round.forEach((w,i)=>{let it=bank.find(x=>x.id===fill[i]);if(it&&it.ja===w.ja)score++});renderGame();$('#bankWrap').style.display='none';$('#finish').style.display='none';let perfect=score===round.length;if(perfect){let m=mastered();round.forEach(w=>m.add(w.id));localStorage.setItem(MASTERED_KEY,JSON.stringify([...m]));let all=records(),k=recordKey(),rec={time:+elapsed.toFixed(1),date:new Date().toLocaleDateString('ja-JP')};all[k]=[...(all[k]||[]),rec].sort((a,b)=>a.time-b.time).slice(0,5);localStorage.setItem(REC_KEY,JSON.stringify(all))}$('#result').classList.add('on');$('#result').innerHTML=`<h2>${perfect?'🎉 パーフェクト！':'あと少し！'}</h2><div class="big">${score} / ${round.length}</div><div class="${perfect?'perfect':'small'}">${perfect?'⭐ 満点記録を保存！ 20語を「覚えた」に追加したよ。':'赤いところを見て、もう一度やってみよう。'}</div><button class="primary" id="again" style="margin-top:14px">もう一度</button>`;$('#again').addEventListener('click',start);renderRecords()}
function resetRound(){start()}
function back(){location.href='./?v=5'}
async function loadWords(){try{let html=await fetch('./index.html?v=5').then(r=>r.text()),m=html.match(/const DATA=(\{.*?\}),W=DATA\.words/s);if(!m)throw new Error('DATA not found');W=JSON.parse(m[1]).words;renderSets();renderRecords();$('#start').disabled=false}catch(e){$('#start').disabled=true;$('#start').textContent='単語データを読み込めませんでした';console.error(e)}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));renderSets();renderRecords()}));
$('#start').addEventListener('click',start);$('#finish').addEventListener('click',finish);$('#reset').addEventListener('click',resetRound);$('#back').addEventListener('click',back);$('#start').disabled=true;loadWords();
</script>
</body></html>
