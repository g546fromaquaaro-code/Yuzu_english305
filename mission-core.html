<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英単語305 カテゴリーミッション</title><style>:root{--ink:#5d4470;--vio:#8f6bd1;--pink:#ff79aa;--gold:#ffd766;--mint:#84dfc2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 4%,#ffe0ec 0,transparent 24rem),radial-gradient(circle at 95% 12%,#dcd3ff 0,transparent 25rem),linear-gradient(#fff9fd,#f4efff 55%,#effbf8);min-height:100vh}button{font:inherit;-webkit-tap-highlight-color:transparent}.wrap{width:min(100%,1180px);margin:auto;padding:10px 12px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.time{border:2px solid #fff;border-radius:16px;background:#ffffffde;padding:8px 12px;box-shadow:0 5px 15px #8c6ba522;font-weight:900}.time{color:#7c58aa;font-size:18px;min-width:106px;text-align:center}.hero{text-align:center;margin:8px 0}.hero .tag{font-size:10px;letter-spacing:.14em;font-weight:950;color:#a178b0}.hero h1{margin:3px 0;color:#70498b;font-size:34px;line-height:1}.hero h1 span{color:#ff6fa2;text-shadow:2px 3px #ffe4ee}.hero p{margin:4px 0 0;font-size:11px;color:#886f93;line-height:1.35}.mission{max-width:980px;margin:auto;padding:14px;border:2px solid #fff;border-radius:24px;background:#ffffffda;box-shadow:0 12px 32px #8c68a31d}.category-title{margin:0 0 8px;text-align:center;font-size:12px;font-weight:950;color:#7d5a91}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.catbtn{border:2px solid #eadcf0;border-radius:16px;padding:10px 8px;background:#fff;color:#77598b;text-align:center;font-weight:900;cursor:pointer}.catbtn span{display:block;font-size:20px;margin-bottom:2px}.catbtn small{display:block;margin-top:2px;color:#9b83a5;font-size:9px}.catbtn.on{border-color:#ff8fbb;color:#fff;background:linear-gradient(135deg,#8e6bd0,#ff79aa);box-shadow:0 4px 0 #7152a8}.sets{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}.set{border:2px solid #ead9f1;border-radius:99px;padding:7px 11px;background:#fff;color:#80648f;font-weight:850}.set.on{border-color:#ff95bd;background:#fff0f7;color:#cb5d8d}.start{width:100%;margin-top:11px;border:0;border-radius:18px;padding:13px;color:#fff;background:linear-gradient(135deg,#8c6bd0,#ff78a8);font-size:15px;font-weight:950;box-shadow:0 6px 0 #6f52aa}.records{margin-top:10px;padding:10px;border-radius:16px;background:#fff7fb;font-size:11px}.rank{display:flex;justify-content:space-between;margin-top:5px;padding:7px 9px;border-radius:10px;background:#fff}.game{display:none}.game.on{display:block}.hud{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;max-width:980px;margin:5px auto 6px}.track{height:9px;background:#eadff0;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold),var(--mint));transition:.2s}.count{font-size:12px;font-weight:950;color:#8c5baa}.words{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.slot{min-width:0;border:2px solid #eadcf0;border-radius:12px;padding:7px 8px;background:#fff;text-align:left;box-shadow:0 2px 7px #8e6ea011}.slot .num{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:5px;border-radius:6px;background:#f2eaff;color:#805fa1;font-size:9px;font-weight:950}.ja{font-size:13px;font-weight:950;color:#704d84;line-height:1.15}.ans{display:block;margin-top:4px;min-height:25px;padding:5px 7px;border:2px dashed #e6d5ed;border-radius:8px;color:#a48aae;font-size:12.5px;font-weight:850}.slot.active{outline:3px solid #ff9ac1}.slot.ok{border-color:#6fd1ad;background:#effbf6}.slot.bad{border-color:#ef8da0;background:#fff1f4}.correct{display:block;margin-top:2px;color:#c74f6c;font-size:9.5px;font-weight:900}.banktitle{text-align:center;margin:7px 0 5px;font-size:11px;font-weight:950;color:#86659a}.bankWrap{max-width:980px;margin:0 auto}.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;overflow:visible}.chip{border:2px solid #eadbef;border-radius:99px;padding:9px 15px;background:#fff;color:#75548c;font-size:14px;font-weight:900;box-shadow:0 2px 6px #906da316;min-height:38px}.chip.used{opacity:.25;transform:scale(.92)}.actions{max-width:980px;margin:9px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.retry,.finish{border:0;border-radius:15px;padding:11px 12px;font-size:12.5px;font-weight:950}.retry{background:#fff;color:#846896;border:2px solid #e7d8ed}.finish{color:#fff;background:linear-gradient(135deg,#7f64c8,#ff72a5);box-shadow:0 5px 0 #654ba2}.result{display:none;max-width:980px;margin:8px auto 0;padding:12px;border-radius:20px;background:linear-gradient(135deg,#fff4b7,#ffe7f1);text-align:center}.result.on{display:block}.result h2{margin:0;color:#7c558e}.score{font-size:34px;font-weight:950;color:#e977a0}.burst{font-size:26px;letter-spacing:4px}.small{font-size:10px;color:#927b99}.spark{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:fly .8s ease forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(180deg);opacity:0}}@media(max-width:900px){.cats{grid-template-columns:repeat(2,1fr)}.words{grid-template-columns:repeat(3,minmax(0,1fr))}.chip{font-size:13px;padding:8px 12px}.time{font-size:16px}}@media(max-width:650px){.wrap{padding:8px}.hero h1{font-size:28px}.words{grid-template-columns:repeat(2,minmax(0,1fr))}.ja{font-size:12px}.ans{font-size:11.5px}.chip{font-size:12px;padding:7px 10px}.cats{gap:6px}.catbtn{padding:8px 6px}}@media(max-width:390px){.words{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><button class="back" id="back">← 305語へ</button><div class="time" id="timer">⏱ 0.0秒</div></div><section id="setup"><div class="hero"><div class="tag">CATEGORY WORD MISSION</div><h1>🎮 <span>MISSION</span></h1><p>いつもの英単語305と同じカテゴリーから選んで挑戦！</p></div><div class="mission"><p class="category-title">カテゴリーを選ぼう</p><div class="cats" id="cats"></div><div class="sets" id="sets"></div><button class="start" id="start">🚀 ミッション開始！</button><div class="records"><b>🏆 このミッションの満点タイム TOP5</b><div id="records"></div></div></div></section><section class="game" id="game"><div class="hero"><div class="tag" id="label">CATEGORY MISSION</div><h1>⚡ 英単語を<span>セット！</span></h1><p>日本語をタップ → 下の英単語を選ぼう。全部埋めたら「終わり」！</p></div><div class="hud"><div class="track"><i id="progress"></i></div><div class="count" id="count">0 / 20</div></div><div class="words" id="words"></div><div class="bankWrap" id="bankWrap"><div class="banktitle">👇 英単語カード</div><div class="bank" id="bank"></div></div><div class="actions"><button class="retry" id="reset">🔄 やり直す</button><button class="finish" id="finish">🏁 終わり</button></div><div class="result" id="result"></div></section></main><script>const MKEY='eigo305-mastered-v1',RKEY='eigo305-category-mission-records-v1';let W=[],C=[],category='pronoun',setIndex=0,round=[],bank=[],fill={},active=0,startAt=0,timerId=null,graded=false;const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function mastered(){try{return new Set(JSON.parse(localStorage.getItem(MKEY)||'[]'))}catch{return new Set()}}function records(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}')}catch{return {}}}function catMeta(){return C.find(c=>c.id===category)||{label:category,icon:'📚'}}function catWords(){return W.filter(w=>w.category===category)}function chunk(){let ws=catWords();return ws.slice(setIndex*20,setIndex*20+20)}function key(){return 'cat-'+category+'-'+setIndex}function showRecords(){let r=(records()[key()]||[]).slice(0,5);$('#records').innerHTML=r.length?r.map((x,i)=>`<div class="rank"><span>${['🥇','🥈','🥉','4️⃣','5️⃣'][i]} ${i+1}位</span><b>${x.time.toFixed(1)}秒</b></div>`).join(''):'<div class="small" style="margin-top:7px">まだ満点記録はありません</div>'}function showCategories(){$('#cats').innerHTML=C.map(c=>{let n=W.filter(w=>w.category===c.id).length;return `<button class="catbtn ${c.id===category?'on':''}" data-cat="${c.id}"><span>${c.icon}</span>${c.label}<small>${n}語</small></button>`}).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;setIndex=0;showCategories();showSets();showRecords()})}function showSets(){let ws=catWords(),n=Math.ceil(ws.length/20);$('#sets').innerHTML=Array.from({length:n},(_,i)=>{let a=i*20+1,b=Math.min(ws.length,(i+1)*20);return `<button class="set ${i===setIndex?'on':''}" data-i="${i}">${a}〜${b}</button>`}).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{setIndex=+b.dataset.i;showSets();showRecords()});let size=chunk().length;$('#start').textContent=`🚀 ${size}語ミッション開始！`}function pick(){return shuffle(chunk())}function start(){round=pick();if(!round.length)return;bank=shuffle(round.map((w,i)=>({id:i,en:w.en,used:null})));fill={};active=0;graded=false;$('#setup').style.display='none';$('#game').classList.add('on');$('#result').classList.remove('on');$('#result').innerHTML='';$('#bankWrap').style.display='block';$('#finish').style.display='block';let m=catMeta(),ws=catWords(),a=setIndex*20+1,b=Math.min(ws.length,(setIndex+1)*20);$('#label').textContent=`${m.icon} ${m.label} ${a}〜${b}`;startAt=performance.now();clearInterval(timerId);$('#timer').textContent='⏱ 0.0秒';timerId=setInterval(()=>$('#timer').textContent='⏱ '+((performance.now()-startAt)/1000).toFixed(1)+'秒',100);render()}function render(){let used=Object.keys(fill).length;$('#progress').style.width=(used/round.length*100)+'%';$('#count').textContent=used+' / '+round.length;$('#words').innerHTML=round.map((w,i)=>{let x=bank.find(a=>a.id===fill[i]),ok=graded&&x&&x.en===w.en,bad=graded&&(!x||x.en!==w.en);return `<button class="slot ${!graded&&active===i?'active':''} ${ok?'ok':''} ${bad?'bad':''}" data-s="${i}"><span class="num">${i+1}</span><span class="ja">${w.ja}</span><span class="ans">${x?x.en:'？'}</span>${bad?`<span class="correct">正解：${w.en}</span>`:''}</button>`}).join('');$('#bank').innerHTML=graded?'':bank.map(x=>`<button class="chip ${x.used!==null?'used':''}" data-c="${x.id}">${x.en}</button>`).join('');if(!graded){document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>slot(+b.dataset.s));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>chip(+b.dataset.c))}}function slot(i){if(fill[i]!=null){let x=bank.find(a=>a.id===fill[i]);if(x)x.used=null;delete fill[i]}active=i;render()}function chip(id){let x=bank.find(a=>a.id===id);if(!x)return;if(x.used!==null){delete fill[x.used];x.used=null;render();return}let s=active;if(s==null||fill[s]!=null)s=round.findIndex((_,i)=>fill[i]==null);if(s<0)return;fill[s]=id;x.used=s;active=round.findIndex((_,i)=>fill[i]==null);if(active<0)active=null;render()}function sparkle(){for(let i=0;i<16;i++){let s=document.createElement('i');s.className='spark';s.textContent=i%2?'★':'✦';s.style.left=(45+Math.random()*10)+'vw';s.style.top='48vh';s.style.color=['#ff7aaa','#9b7bd5','#f0b830','#70cfad'][i%4];s.style.setProperty('--x',(Math.random()*300-150)+'px');s.style.setProperty('--y',(Math.random()*250-170)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}function finish(){if(graded)return;graded=true;clearInterval(timerId);let sec=(performance.now()-startAt)/1000,score=0;round.forEach((w,i)=>{let x=bank.find(a=>a.id===fill[i]);if(x&&x.en===w.en)score++});render();$('#bankWrap').style.display='none';$('#finish').style.display='none';let perfect=score===round.length;if(perfect){sparkle();let m=mastered();round.forEach(w=>m.add(w.id));localStorage.setItem(MKEY,JSON.stringify([...m]));let all=records(),k=key();all[k]=[...(all[k]||[]),{time:+sec.toFixed(1),date:new Date().toLocaleDateString('ja-JP')}].sort((a,b)=>a.time-b.time).slice(0,5);localStorage.setItem(RKEY,JSON.stringify(all))}$('#result').classList.add('on');$('#result').innerHTML=`<div class="burst">${perfect?'✨🏆✨':'🎯'}</div><h2>${perfect?'MISSION CLEAR!':'あと少し！'}</h2><div class="score">${score} / ${round.length}</div><p>${perfect?`⭐ ${round.length}語をマスターに追加したよ。`:'赤いところを確認して、もう一度挑戦！'}</p><button class="start" id="again">もう一度チャレンジ</button>`;$('#again').onclick=start;showRecords()}async function load(){try{let h=await fetch('./legacy.html?v=12',{cache:'no-store'}).then(r=>r.text()),m=h.match(/const DATA=(\{.*?\}),W=DATA\.words/s);if(!m)throw Error('DATA');let d=JSON.parse(m[1]);W=d.words;C=d.categoryMeta;category=C[0].id;showCategories();showSets();showRecords();$('#start').disabled=false}catch(e){$('#start').textContent='単語データを読み込めませんでした';console.error(e)}}$('#start').onclick=start;$('#finish').onclick=finish;$('#reset').onclick=start;$('#back').onclick=()=>location.href='./?v=12';$('#start').disabled=true;load();</script></body></html>
