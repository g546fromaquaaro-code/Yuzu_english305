<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英単語305 ミッション20</title><style>:root{--ink:#5d4470;--vio:#8f6bd1;--pink:#ff79aa;--gold:#ffd766;--mint:#84dfc2;--red:#ef8196}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 4%,#ffe0ec 0,transparent 24rem),radial-gradient(circle at 95% 12%,#dcd3ff 0,transparent 25rem),linear-gradient(#fff9fd,#f4efff 55%,#effbf8);min-height:100vh}button{font:inherit;-webkit-tap-highlight-color:transparent}.wrap{width:min(100%,780px);margin:auto;padding:18px 14px 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,.time{border:2px solid #fff;border-radius:18px;background:#ffffffdd;padding:10px 13px;box-shadow:0 6px 18px #8c6ba526;font-weight:900}.time{color:#7c58aa}.hero{text-align:center;margin:20px 0 16px}.hero .tag{font-size:11px;letter-spacing:.16em;font-weight:950;color:#a178b0}.hero h1{margin:6px 0;color:#70498b;font-size:clamp(34px,9vw,58px);line-height:1}.hero h1 span{color:#ff6fa2;text-shadow:3px 4px #ffe4ee}.hero p{font-size:13px;color:#886f93;line-height:1.6}.mission{padding:18px;border:2px solid #fff;border-radius:26px;background:#ffffffd8;box-shadow:0 16px 38px #8c68a323}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{border:0;border-radius:18px;padding:13px 9px;background:#f3ebf8;color:#826590;font-weight:900}.mode.on{color:#fff;background:linear-gradient(135deg,var(--vio),var(--pink));box-shadow:0 6px 0 #6e52a5}.sets{display:flex;gap:7px;overflow-x:auto;margin-top:12px;padding-bottom:4px}.set{flex:0 0 auto;border:2px solid #ead9f1;border-radius:99px;padding:8px 11px;background:#fff;color:#80648f;font-weight:850}.set.on{border-color:#ff95bd;background:#fff0f7;color:#cb5d8d}.start{width:100%;margin-top:15px;border:0;border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#8c6bd0,#ff78a8);font-size:17px;font-weight:950;box-shadow:0 7px 0 #6f52aa}.start:active,.chip:active,.slot:active{transform:scale(.97)}.records{margin-top:15px;padding:13px;border-radius:18px;background:#fff7fb}.rank{display:flex;justify-content:space-between;margin-top:6px;padding:8px 10px;border-radius:11px;background:#fff;font-size:12px}.game{display:none}.game.on{display:block}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0}.track{height:13px;background:#eadff0;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold),var(--mint));transition:.2s}.count{font-weight:950;color:#8c5baa}.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{min-width:0;border:2px solid #eadcf0;border-radius:17px;padding:10px;background:#fff;text-align:left;box-shadow:0 4px 12px #8e6ea014}.slot .num{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:6px;border-radius:8px;background:#f2eaff;color:#805fa1;font-size:10px;font-weight:950}.ja{font-weight:950;color:#704d84}.ans{display:block;margin-top:7px;min-height:31px;padding:7px 9px;border:2px dashed #e6d5ed;border-radius:11px;color:#a48aae;font-weight:850}.slot.active{outline:3px solid #ff9ac1;animation:pulse .7s ease-in-out infinite alternate}.slot.ok{border-color:#6fd1ad;background:#effbf6}.slot.bad{border-color:#ef8da0;background:#fff1f4}.correct{display:block;margin-top:4px;color:#c74f6c;font-size:10px;font-weight:900}.banktitle{text-align:center;margin:18px 0 9px;font-size:12px;font-weight:950;color:#86659a}.bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.chip{border:2px solid #eadbef;border-radius:99px;padding:9px 12px;background:#fff;color:#75548c;font-weight:900;box-shadow:0 4px 10px #906da319}.chip.used{opacity:.25;transform:scale(.92)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.retry,.finish{border:0;border-radius:18px;padding:14px;font-weight:950}.retry{background:#fff;color:#846896;border:2px solid #e7d8ed}.finish{color:#fff;background:linear-gradient(135deg,#7f64c8,#ff72a5);box-shadow:0 5px 0 #654ba2}.result{display:none;margin-top:16px;padding:19px;border-radius:24px;background:linear-gradient(135deg,#fff4b7,#ffe7f1);text-align:center;overflow:hidden}.result.on{display:block}.result h2{margin:0;color:#7c558e}.score{font-size:40px;font-weight:950;color:#e977a0}.burst{font-size:30px;letter-spacing:5px;animation:pop .45s ease}.small{font-size:11px;color:#927b99}.spark{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:fly .8s ease forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(180deg);opacity:0}}@keyframes pulse{to{box-shadow:0 0 0 5px #ffb4d144}}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}@media(max-width:520px){.words{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head><body><main class="wrap"><div class="top"><button class="back" id="back">← 305語へ</button><div class="time" id="timer">⏱ 0.0秒</div></div><section id="setup"><div class="hero"><div class="tag">WORD MATCH MISSION</div><h1>🎮 <span>MISSION 20</span></h1><p>日本語20個に、英単語カードをセット！<br>毎回シャッフルされるから、同じセットでも新しい勝負。</p></div><div class="mission"><div class="modegrid"><button class="mode on" data-mode="set">📚 20語ミッション</button><button class="mode" data-mode="weak">🌱 未習得ミッション</button></div><div class="sets" id="sets"></div><button class="start" id="start">🚀 ミッション開始！</button><div class="records"><b>🏆 満点タイム TOP5</b><div id="records"></div></div></div></section><section class="game" id="game"><div class="hero"><div class="tag" id="label">MISSION 20</div><h1>⚡ 英単語を<span>セット！</span></h1><p>日本語をタップ → 下の英単語を選ぼう。20個埋めたら「終わり」！</p></div><div class="hud"><div class="track"><i id="progress"></i></div><div class="count" id="count">0 / 20</div></div><div class="words" id="words"></div><div id="bankWrap"><div class="banktitle">👇 英単語カード</div><div class="bank" id="bank"></div></div><div class="actions"><button class="retry" id="reset">🔄 やり直す</button><button class="finish" id="finish">🏁 終わり</button></div><div class="result" id="result"></div></section></main><script>const MKEY='eigo305-mastered-v1',RKEY='eigo305-hayamihyo-records-v1';let W=[],mode='set',setIndex=0,round=[],bank=[],fill={},active=0,startAt=0,timerId=null,graded=false;const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function mastered(){try{return new Set(JSON.parse(localStorage.getItem(MKEY)||'[]'))}catch{return new Set()}}function records(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}')}catch{return {}}}function key(){return mode==='set'?'set-'+setIndex:'weak'}function showRecords(){let r=(records()[key()]||[]).slice(0,5);$('#records').innerHTML=r.length?r.map((x,i)=>`<div class="rank"><span>${['🥇','🥈','🥉','4️⃣','5️⃣'][i]} ${i+1}位</span><b>${x.time.toFixed(1)}秒</b></div>`).join(''):'<div class="small" style="margin-top:8px">まだ満点記録はありません</div>'}function showSets(){let n=Math.ceil(W.length/20);$('#sets').innerHTML=Array.from({length:n},(_,i)=>`<button class="set ${i===setIndex?'on':''}" data-i="${i}">${i*20+1}〜${Math.min(W.length,(i+1)*20)}</button>`).join('');document.querySelectorAll('.set').forEach(b=>b.onclick=()=>{setIndex=+b.dataset.i;showSets();showRecords()});$('#sets').style.display=mode==='set'?'flex':'none'}function pick(){if(mode==='set')return shuffle(W.slice(setIndex*20,setIndex*20+20));let m=mastered(),u=W.filter(w=>!m.has(w.id)),p=u.length>=20?u:[...u,...W.filter(w=>m.has(w.id))];return shuffle(p).slice(0,20)}function start(){round=pick();bank=shuffle(round.map((w,i)=>({id:i,en:w.en,used:null})));fill={};active=0;graded=false;$('#setup').style.display='none';$('#game').classList.add('on');$('#result').classList.remove('on');$('#result').innerHTML='';$('#bankWrap').style.display='block';$('#finish').style.display='block';$('#label').textContent=mode==='set'?`${setIndex*20+1}〜${setIndex*20+round.length} WORDS`:'UNMASTERED 20';startAt=performance.now();clearInterval(timerId);timerId=setInterval(()=>$('#timer').textContent='⏱ '+((performance.now()-startAt)/1000).toFixed(1)+'秒',100);render()}function render(){let used=Object.keys(fill).length;$('#progress').style.width=(used/round.length*100)+'%';$('#count').textContent=used+' / '+round.length;$('#words').innerHTML=round.map((w,i)=>{let x=bank.find(a=>a.id===fill[i]),ok=graded&&x&&x.en===w.en,bad=graded&&(!x||x.en!==w.en);return `<button class="slot ${!graded&&active===i?'active':''} ${ok?'ok':''} ${bad?'bad':''}" data-s="${i}"><span class="num">${i+1}</span><span class="ja">${w.ja}</span><span class="ans">${x?x.en:'？'}</span>${bad?`<span class="correct">正解：${w.en}</span>`:''}</button>`}).join('');$('#bank').innerHTML=graded?'':bank.map(x=>`<button class="chip ${x.used!==null?'used':''}" data-c="${x.id}">${x.en}</button>`).join('');if(!graded){document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>slot(+b.dataset.s));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>chip(+b.dataset.c))}}function slot(i){if(fill[i]!=null){let x=bank.find(a=>a.id===fill[i]);if(x)x.used=null;delete fill[i]}active=i;render()}function chip(id){let x=bank.find(a=>a.id===id);if(!x)return;if(x.used!==null){delete fill[x.used];x.used=null;render();return}let s=active;if(s==null||fill[s]!=null)s=round.findIndex((_,i)=>fill[i]==null);if(s<0)return;fill[s]=id;x.used=s;active=round.findIndex((_,i)=>fill[i]==null);if(active<0)active=null;render()}function sparkle(){for(let i=0;i<16;i++){let s=document.createElement('i');s.className='spark';s.textContent=i%2?'★':'✦';s.style.left=(45+Math.random()*10)+'vw';s.style.top='48vh';s.style.color=['#ff7aaa','#9b7bd5','#f0b830','#70cfad'][i%4];s.style.setProperty('--x',(Math.random()*300-150)+'px');s.style.setProperty('--y',(Math.random()*250-170)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}function finish(){if(graded)return;graded=true;clearInterval(timerId);let sec=(performance.now()-startAt)/1000,score=0;round.forEach((w,i)=>{let x=bank.find(a=>a.id===fill[i]);if(x&&x.en===w.en)score++});render();$('#bankWrap').style.display='none';$('#finish').style.display='none';let perfect=score===round.length;if(perfect){sparkle();let m=mastered();round.forEach(w=>m.add(w.id));localStorage.setItem(MKEY,JSON.stringify([...m]));let all=records(),k=key();all[k]=[...(all[k]||[]),{time:+sec.toFixed(1),date:new Date().toLocaleDateString('ja-JP')}].sort((a,b)=>a.time-b.time).slice(0,5);localStorage.setItem(RKEY,JSON.stringify(all))}$('#result').classList.add('on');$('#result').innerHTML=`<div class="burst">${perfect?'✨🏆✨':'🎯'}</div><h2>${perfect?'MISSION CLEAR!':'あと少し！'}</h2><div class="score">${score} / ${round.length}</div><p>${perfect?'⭐ 満点タイムを保存！ 20語をマスターに追加したよ。':'赤いところの英単語を確認して、もう一度挑戦！'}</p><button class="start" id="again">もう一度チャレンジ</button>`;$('#again').onclick=start;showRecords()}async function load(){try{let h=await fetch('./index.html?v=5').then(r=>r.text()),m=h.match(/const DATA=(\{.*?\}),W=DATA\.words/s);if(!m)throw Error('DATA');W=JSON.parse(m[1]).words;showSets();showRecords();$('#start').disabled=false}catch(e){$('#start').textContent='単語データを読み込めませんでした'}}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));showSets();showRecords()});$('#start').onclick=start;$('#finish').onclick=finish;$('#reset').onclick=start;$('#back').onclick=()=>location.href='./?v=5';$('#start').disabled=true;load();</script></body></html>
